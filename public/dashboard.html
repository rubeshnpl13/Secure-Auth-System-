<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Secure Auth System — protected dashboard."
    />
    <title>Dashboard · Secure Auth</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <main class="dashboard-page">
      <section class="dashboard-card" aria-labelledby="page-title">
        <div class="dashboard-header">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span>Secure Auth</span>
          </div>

          <button id="logout-button" class="secondary-button" type="button">
            Sign out
          </button>
        </div>

        <div class="dashboard-content">
          <p class="eyebrow">Protected area</p>
          <h1 id="page-title">You are authenticated.</h1>
          <p class="subtitle">
            This page is available only with a valid access token.
          </p>

          <dl class="user-details">
            <div>
              <dt>Email</dt>
              <dd id="user-email">Loading…</dd>
            </div>
            <div>
              <dt>User ID</dt>
              <dd id="user-id">Loading…</dd>
            </div>
            <div>
              <dt>Account created</dt>
              <dd id="user-created-at">Loading…</dd>
            </div>
          </dl>
        </div>
      </section>
    </main>

    <script type="module" src="/js/dashboard.js"></script>
  </body>
</html>
